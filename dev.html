<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Factor0x — Coming soon</title>
  <meta name="description" content="Factor0x is still in development. Reach out and we'll get back to you.">
  <meta name="robots" content="noindex, follow">
  <link rel="stylesheet" href="css/site.css?v=demo3">
  <link rel="stylesheet" href="css/main.css?v=demo3">
  <style>
    body {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      background: var(--bg);
      color: var(--text);
    }

    .dev-card {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 20px;
      animation: blurIn 0.9s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .dev-logo {
      width: 120px;
      height: 120px;
      object-fit: contain;
      pointer-events: none;
    }

    .dev-brand {
      font-family: 'F0xSans', sans-serif;
      font-weight: 700;
      font-size: clamp(20px, 4vw, 26px);
      letter-spacing: -0.03em;
      line-height: 1;
    }

    .dev-title {
      font-size: clamp(22px, 4.5vw, 30px);
      font-weight: 700;
      line-height: 1.14;
      letter-spacing: -0.02em;
    }

    .dev-text {
      max-width: 380px;
      color: var(--text-muted);
      font-size: 15px;
      line-height: 1.6;
    }

    .dev-actions {
      margin-top: 4px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }

    a.GoldBtn { text-decoration: none; }

    .dev-back {
      color: var(--text-nav);
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      transition: color 0.2s ease;
    }
    .dev-back:hover { color: var(--text); }
  </style>
</head>
<body>

  <main class="dev-card">

    <img class="dev-logo" src="resources/logo/logo-3d-c.webp?v=demo3" alt="Factor0x" width="120" height="120">

    <span class="dev-brand"><span class="logo-factor">Factor</span><span class="logo-0x">0x</span></span>

    <h1 class="dev-title" data-i18n="title">We're still building</h1>

    <p class="dev-text" data-i18n="text">
      Factor0x isn't fully live yet. Reach out and we'll get back to you.
    </p>

    <div class="dev-actions">
      <a class="GoldBtn" href="mailto:hello@factor0x.com"><span data-i18n="cta">Email us</span></a>
      <a class="dev-back" href="/" data-i18n="back">← Back to site</a>
    </div>

  </main>

  <script>
    // Match the language of the page the visitor came from (or their browser).
    (function () {
      var ref = document.referrer || '';
      var isRu = /\/ru(\/|$)/.test(ref) ||
        (!/\/en(\/|$)/.test(ref) &&
          (navigator.language || navigator.userLanguage || '').toLowerCase().slice(0, 2) === 'ru');
      if (!isRu) return;

      document.documentElement.lang = 'ru';
      var ru = {
        title: 'Мы ещё в разработке',
        text: 'Factor0x пока работает не в полном объёме. Напишите нам, и мы свяжемся с вами.',
        cta: 'Написать нам',
        back: '← Вернуться на сайт'
      };
      document.querySelectorAll('[data-i18n]').forEach(function (el) {
        var key = el.getAttribute('data-i18n');
        if (ru[key]) el.textContent = ru[key];
      });
      document.title = 'Factor0x — Скоро запуск';
    })();
  </script>

</body>
</html>
